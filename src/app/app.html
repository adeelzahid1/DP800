<a class="skip-link" href="#main">{{ locale.t('a11y.skipToContent') }}</a>

<header class="topbar">
  <a routerLink="/" class="brand">
    <span class="brand-badge">DP-800</span>
    <span class="brand-name">{{ locale.t('app.title') }}</span>
  </a>

  <nav class="main-nav" [attr.aria-label]="locale.t('nav.label')">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      {{ locale.t('nav.dashboard') }}
    </a>
    <a routerLink="/study" routerLinkActive="active">{{ locale.t('nav.study') }}</a>
    <a routerLink="/mock" routerLinkActive="active">{{ locale.t('nav.mock') }}</a>
    <a routerLink="/search" routerLinkActive="active">{{ locale.t('nav.search') }}</a>
  </nav>

  <div class="topbar-actions">
    <label class="visually-hidden" for="locale-select">{{ locale.t('locale.switch') }}</label>
    <select
      id="locale-select"
      class="locale-select"
      [value]="locale.locale()"
      (change)="onLocaleChange($event)"
    >
      @for (loc of content.manifest()?.locales ?? []; track loc.code) {
        <option [value]="loc.code" [disabled]="!loc.enabled">
          {{ loc.label }}{{ loc.enabled ? '' : ' (' + locale.t('locale.comingSoon') + ')' }}
        </option>
      }
    </select>

    <button
      type="button"
      class="btn theme-btn"
      (click)="theme.toggle()"
      [attr.aria-label]="locale.t('theme.toggle')"
      [title]="locale.t('theme.toggle')"
    >
      @if (theme.effective() === 'dark') {
        <span aria-hidden="true">🌙</span>
      } @else {
        <span aria-hidden="true">☀️</span>
      }
    </button>
  </div>
</header>

<main id="main" class="main-outlet">
  @if (content.loadError(); as err) {
    <p class="card load-error">{{ err }}</p>
  }
  <router-outlet />
</main>
